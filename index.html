<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="stopwatch-card">
      <div class="title-bar">
        <h1>Stopwatch</h1>
        <p>Track elapsed time with laps and pause support.</p>
      </div>

      <div class="display-panel" id="display">00:00:00.000</div>

      <div class="control-row">
        <button class="control-button" id="startBtn">Start</button>
        <button class="control-button secondary" id="pauseBtn">Pause</button>
        <button class="control-button tertiary" id="resetBtn">Reset</button>
      </div>

      <div class="lap-row">
        <button class="control-button wide" id="lapBtn">Lap</button>
      </div>

      <div class="lap-list-panel">
        <div class="lap-header">
          <span>Lap</span>
          <span>Time</span>
        </div>
        <ul id="lapList" class="lap-list"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
